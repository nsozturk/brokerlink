<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#1c1512"/></linearGradient></defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <g transform="translate(72,70)">
    <rect width="76" height="76" rx="16" fill="#1f1e1d" stroke="#3a3836"/>
    <path d="M56.6 53.6A24 24 0 1 1 56.6 22.4" fill="none" stroke="#d97757" stroke-width="9"/>
    <path d="M38 38H61" stroke="#d97757" stroke-width="9"/><circle cx="61" cy="38" r="7" fill="#f5f4ef"/>
  </g>
  <text x="168" y="124" font-size="60" font-weight="700" fill="#f5f4ef">brokerlink</text>
  <text x="72" y="196" font-size="24" fill="#c9c4b8">Your MobilG brokerage tab, as an MCP server</text>
  <text x="72" y="230" font-size="24" fill="#c9c4b8">for Claude, Codex, Gemini and any AI CLI.</text>
  <rect x="72" y="262" width="330" height="44" rx="10" fill="#1f1e1d" stroke="#d97757"/>
  <text x="92" y="291" font-size="19" font-family="Menlo,monospace" fill="#d97757">read("portfolio")</text>
  <g transform="translate(700,48)">
    <rect width="510" height="264" rx="14" fill="#11151f" stroke="#2a3040"/>
    <circle cx="26" cy="24" r="6" fill="#ff5f57"/><circle cx="46" cy="24" r="6" fill="#febc2e"/><circle cx="66" cy="24" r="6" fill="#28c840"/>
    <g font-family="Menlo,monospace" font-size="16" xml:space="preserve">
      <text x="24" y="66" fill="#8b93a7">$ agy "what is my P/L today?"</text>
      <text x="24" y="98" fill="#d97757">▸ brokerlink.read("portfolio")</text>
      <text x="24" y="132" fill="#f5f4ef">SYMBOL   QTY     COST    LAST     P/L</text>
