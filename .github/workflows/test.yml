name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: python3 tests/test_daemon.py
      - run: node --check extension/background.js && node --check extension/popup.js
      - name: no personal paths or session values in the tree
        run: "! grep -rnE '/Users/[a-z0-9]+/|otpToken=[A-Za-z0-9-]{8}' --exclude-dir=.git --exclude=test.yml ."
